services:
  db_test:
    image: postgres:15
    env_file:
      - .testenv
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_wallets"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build: .
    env_file:
      - .testenv
    volumes:
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    command: >
      sh -c "
        alembic upgrade head &&
        printf '\n\033[32m----------------------------------------\033[0m\n' &&
        printf '\033[32m       Запускаю Тесты...\033[0m\n' &&
        printf '\033[32m----------------------------------------\033[0m\n' &&
        pytest -v --tb=short --color=yes tests/
      "
    depends_on:
      db_test:
        condition: service_healthy
    restart: 'no'

volumes:
  pgdata_test: