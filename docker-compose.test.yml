services:
  db_test:
    image: postgres:15
    env_file:
      - .testenv
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_wallets"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    env_file:
      - .testenv
    command: alembic upgrade head
    depends_on:
      db_test:
        condition: service_healthy
    restart: 'no'

  test:
    build: .
    env_file:
      - .testenv
    volumes:
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    command: pytest -v --tb=short --color=yes tests/
    depends_on:
      db_test:
        condition: service_healthy
    restart: 'no'