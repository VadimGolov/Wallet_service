services:
  db_test:
    image: postgres:15
    env_file:
      - .testenv
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d test_wallets']
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build: .
    env_file:
      - .testenv
    volumes:
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./app/logs:/app/app/logs
    command: > 
      sh -c '
        alembic upgrade head &&
        pytest -v -s --tb=short --color=yes tests/'
    depends_on:
      db_test:
        condition: service_healthy
    restart: 'no'